# ENGENDRÉ — ne pas éditer à la main.
#
# ⚠️  NE PAS RÉGÉNÉRER par réflexe. Le tirage vient de `db/ingredients.yaml`, qui
# grossit : régénérer après une modification du référentiel produit un AUTRE
# catalogue, et remet donc à zéro le repère du §14.1. Tous les scores mesurés
# avant deviennent incomparables avec ceux d'après. On régénère quand on veut
# délibérément changer de référence, et on l'écrit dans le message de commit.
#
# Composé depuis `db/ingredients.yaml`, notre propre fichier. Aucun contenu
# externe, aucun modèle : ni I9 ni I7 ne sont en jeu. Ce que le banc d'essai
# mesure est un MODÈLE sur de la planification, ce qui demande une structure
# réaliste — pas un contenu authentique.

households:
- key: baby_only
  why: No catalogue recipe carries `baby` (§6.4). The plan must contain NOTHING and
    say so — inventing a meal here is the failure.
  members:
  - alias: m1
    life_stage: baby
  constraints: []
- key: severe_milk_allergy
  why: 'The hard filter at its narrowest: milk is the most common allergen in the
    catalogue, and the pool collapses.'
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: young_child
  constraints:
  - member: m2
    allergen_code: milk
    severity: severe_allergy
- key: member_intolerance
  why: 'The common case: one member has an intolerance and the catalogue holds enough
    safe dishes that ONE preparation still feeds everyone. Named after what it is
    — an earlier name claimed it forced two dishes, which measurement disproved.'
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: teen_adult
  - alias: m3
    life_stage: young_child
  constraints:
  - member: m3
    allergen_code: gluten
    severity: intolerance
- key: teen_and_young_child
  why: 'Two stages, no allergen: the stage rule alone must not force a second dish,
    since both stages are served by the catalogue.'
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: teen_adult
  - alias: m3
    life_stage: young_child
  constraints: []
- key: founder
  why: 'The household the product is built for, described by its own member: two adults
    and a six-year-old who eats what they eat. It carries the only human reference
    plan (§14.4), so it is the only case whose weeks are judged on quality and not
    merely on validity. The baby of that household is missing on purpose — see `docs/ARCHITECTURE.md`
    §15 on derived dishes.'
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: teen_adult
  - alias: m3
    life_stage: young_child
  constraints: []
- key: busy_week
  why: 'Same shape as `founder` — two adults and a six-year-old, nothing filtered
    — so the only thing this case varies is what the household SAID about its week.
    It carries the three constraints that were all ignored on one real generation:
    a time budget, a day away, and a dish to cook once and eat twice.'
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: teen_adult
  - alias: m3
    life_stage: young_child
  constraints: []
- key: no_constraint
  why: The baseline. Nothing is filtered, `allergens_verified` is not required, and
    the pool is at its widest.
  members:
  - alias: m1
    life_stage: teen_adult
  - alias: m2
    life_stage: teen_adult
  constraints: []
