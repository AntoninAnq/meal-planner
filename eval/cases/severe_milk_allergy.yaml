# Le filtre dur, au plus étroit.
case: severe_milk_allergy
runs: 5

expected_exact:
  # Le lait est l'allergène le plus fréquent du catalogue. Le pré-filtre doit
  # exclure toute recette qui en porte, sans exception et sans arbitrage.
  candidates_carry_milk: 0

expected_properties:
  allergen_violations: 0          # dur, 0 toléré
  dishes_outside_candidates: 0    # dur, 0 toléré
  # Deux mangeurs, deux stades servis par le catalogue : un plat par créneau
  # suffit, et en proposer deux serait cuisiner deux fois pour rien.
  max_dishes_per_slot: "<= 2"
  # §6.2 veut 15-25 candidats par créneau. En dessous, l'arbitrage n'arbitre
  # plus : le modèle recopie le peu qu'on lui donne. Ajouté après la première
  # passe à 5 exécutions, où tout était vert avec CINQ recettes disponibles —
  # un banc qui ne mesure pas la largeur du pool valide un plan impossible.
  candidates_minimum: 15

human_reference:
  note: >-
    Une semaine sans lait se planifie sans effort particulier tant que le
    catalogue est assez large. Ce cas mesure la largeur, pas l'ingéniosité.
