# Railway configuration for the API service only.
#
# The migrations run HERE, before the new container receives traffic, and not in
# the Dockerfile's CMD. `docker-compose.yml` chains `alembic upgrade head` before
# uvicorn, which is fine on a laptop; the production image started uvicorn alone,
# and 0018–0021 were never applied — every `GET /favorites` answered 500 right
# after sign-in.
#
# Pre-deploy rather than CMD: it runs once per deployment instead of once per
# replica start, and a failing migration cancels the deployment while the
# previous one keeps serving, instead of a container restarting in a loop.
#
# Railway does NOT look for this file under the service's Root Directory: the
# service setting "Config-as-code" must point at `/backend/railway.toml`.

[deploy]
preDeployCommand = ["alembic upgrade head"]
