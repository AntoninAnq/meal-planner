# Four services from the first commit, even locally.
#
# Note on `llm`: Ollama itself deliberately runs on the HOST, untouched, still
# listening only on 127.0.0.1. A container cannot reach the host's loopback, so
# this service is a minimal relay that bridges the two.
#
# Why a relay rather than telling Ollama to listen more widely:
#
#   * `OLLAMA_HOST=0.0.0.0` would expose an UNAUTHENTICATED model server to the
#     whole local network — every café Wi-Fi, every shared office.
#   * `OLLAMA_HOST=<bridge ip>` would keep the LAN out but break `ollama run`
#     from a terminal, which then needs the same variable exported.
#
# The relay binds only to the Docker bridge interface, which is `scope link` and
# therefore not routable from the LAN: containers reach it, nothing else does.
# Ollama keeps its default configuration, the CLI keeps working, and no root
# access or systemd edit is needed. It disappears with `docker compose down`.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local tooling (psql, migrations from the host). Not published
    # in production.
    ports:
      - "127.0.0.1:5432:5432"

  llm:
    image: alpine/socat:1.8.0.0
    # Host networking is what lets this container reach Ollama on 127.0.0.1.
    # It is a local-development convenience only: in production the LLM is a
    # cloud API and this service does not exist.
    network_mode: host
    restart: unless-stopped
    command: >
      TCP-LISTEN:11434,bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr
      TCP:127.0.0.1:11434

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      # Built from the SAME interpolated variables the `db` service uses, so the
      # two can never diverge. This matters more than it looks: Compose resolves
      # ${...} from the shell environment BEFORE the .env file, so an exported
      # POSTGRES_PASSWORD on the host silently reaches Postgres while a literal
      # DATABASE_URL written in .env does not — and you get an authentication
      # failure whose cause is nowhere in the file you are reading.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    # Resolves to the Docker bridge, where the `llm` relay listens.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./web
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
