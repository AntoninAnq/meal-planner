# Four services from the first commit, even locally.
#
# Note on `llm`: Ollama itself deliberately runs on the HOST, untouched, still
# listening only on 127.0.0.1. A container cannot reach the host's loopback, so
# this service is a minimal relay that bridges the two.
#
# Why a relay rather than telling Ollama to listen more widely:
#
#   * `OLLAMA_HOST=0.0.0.0` would expose an UNAUTHENTICATED model server to the
#     whole local network — every café Wi-Fi, every shared office.
#   * `OLLAMA_HOST=<bridge ip>` would keep the LAN out but break `ollama run`
#     from a terminal, which then needs the same variable exported.
#
# The relay binds only to the Docker bridge interface, which is `scope link` and
# therefore not routable from the LAN: containers reach it, nothing else does.
# Ollama keeps its default configuration, the CLI keeps working, and no root
# access or systemd edit is needed. It disappears with `docker compose down`.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Exposed for local tooling (psql, migrations from the host). Not published
    # in production.
    ports:
      - "127.0.0.1:5432:5432"

  llm:
    image: alpine/socat:1.8.0.0
    # Host networking is what lets this container reach Ollama on 127.0.0.1.
    # It is a local-development convenience only: in production the LLM is a
    # cloud API and this service does not exist.
    network_mode: host
    restart: unless-stopped
    command: >
      TCP-LISTEN:11434,bind=${DOCKER_BRIDGE_IP:-172.17.0.1},fork,reuseaddr
      TCP:127.0.0.1:11434

  api:
    build:
      context: ./backend
    env_file: .env
    # No `environment:` block. POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # arrive through `env_file` above, which delivers them byte-exact, and the
    # application assembles the connection URL itself (app/config.py).
    #
    # They used to be interpolated into a DATABASE_URL here. Two bugs came out
    # of that, in one evening: a password containing `%` broke URL parsing, and
    # Compose's `${...}` interpolation altered a password made of YAML
    # indicator characters (`!`, `%`, `&`, `*`) — while the same variable
    # delivered by `env_file` arrived intact.
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_started
    # Resolves to the Docker bridge, where the `llm` relay listens.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # The catalogue pipeline (docs/ARCHITECTURE.md §7.5, §11.4).
  #
  # `profiles` is what keeps it OUT of `docker compose up`. This job reaches out
  # to third-party websites; it runs when someone asks for it, never as a side
  # effect of starting the stack:
  #
  #   docker compose run --rm catalog ingest --source <clé-du-descripteur>
  #   docker compose run --rm catalog resolve
  #   docker compose run --rm catalog review
  #
  # No `restart`, no port, no dependency from the user-facing path.
  catalog:
    profiles: ["catalog"]
    build:
      context: ./backend
      dockerfile: Dockerfile.catalog
    env_file: .env
    # Same as `api`: the credentials arrive through `env_file`, never through
    # an interpolated field.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # The whitelist, read-only. It is NOT in the repository: this file is
      # gitignored, and `backend/sources.example.yaml` is the template. See
      # docs/ARCHITECTURE.md §11.5 for why.
      - ./sources.yaml:/config/sources.yaml:ro
      # The campaign cache. A named volume rather than a bind mount: it is not
      # source, it must not reach the repository, and `docker compose down -v`
      # is then all it takes to purge it (I9).
      - catalog_cache:/var/cache/catalog

  web:
    build:
      context: ./web
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

  proxy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  catalog_cache:
