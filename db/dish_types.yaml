# Type de plat — correspondance entre les rubriques déclarées par les sources
# et un ensemble fermé de moments de repas.
#
# POURQUOI CE FICHIER EXISTE. Le catalogue vérifié contient une majorité de
# recettes sucrées : la complétude exigée par I3 sélectionne mécaniquement le
# dessert, dont les huit ingrédients résolvent tous, contre le tajine dont
# quinze lignes en comptent quatre d'inconnues. Un pré-filtre sans cette
# information proposerait des gâteaux au dîner.
#
# CE QUE C'EST, ET CE QUE CE N'EST PAS. Les libellés ci-dessous sont ceux que
# les sources publient elles-mêmes comme métadonnée de leur page — même statut
# que le titre ou la durée. Rien n'est généré (I7) et rien n'est republié (I9) :
# la rubrique sert à décider en interne, elle ne s'affiche pas.
#
# Ce qu'on écrit ici est la CORRESPONDANCE, pas la donnée. Aucun allergène n'y
# est en jeu, donc I1 ne s'applique pas et ces entrées ne passent pas par
# `catalog review`. La relecture est celle du diff Git.
#
# LA RÈGLE DE PRUDENCE, quand une recette porte plusieurs rubriques : le type
# le plus restrictif gagne, dans l'ordre déclaré par `precedence` ci-dessous.
# Une recette étiquetée à la fois « Provence » et « Dessert » est un dessert ;
# une recette étiquetée « Plat » et « Dessert » aussi. Rater un plat coûte un
# candidat, servir un gâteau au dîner coûte la confiance dans l'outil.
#
# UN LIBELLÉ ABSENT DE CE FICHIER VAUT `unknown`, et `unknown` passe le filtre.
# C'est délibéré : 111 des 555 recettes vérifiées n'ont aucune rubrique, et les
# écarter paierait 20 % du catalogue pour une garantie de confort. Le type de
# plat est un défaut de qualité, pas de sécurité.

types:
  - { code: main,      label: Plat }
  - { code: starter,   label: Entrée ou apéritif }
  - { code: side,      label: Accompagnement }
  - { code: dessert,   label: Dessert }
  - { code: snack,     label: Goûter }
  - { code: breakfast, label: Petit déjeuner }
  - { code: drink,     label: Boisson }
  - { code: component, label: Composant — ni plat ni dessert }

# Du plus restrictif au moins restrictif.
precedence: [component, drink, dessert, snack, breakfast, side, starter, main]

labels:

  # ── Composants : ce ne sont pas des plats ────────────────────────────────
  # Une vinaigrette ou un roux blanc ne peut occuper aucun créneau. Sans cette
  # catégorie ils tomberaient dans « pas étiqueté dessert », donc dans les
  # candidats du dîner.
  component:
