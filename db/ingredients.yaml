  # Le petit-beurre est un BISCUIT, pas une petite quantité de beurre. C'est le
  # seul cas mesuré du catalogue où dépouiller un calibre retirerait un
  # allergène : `beurre` ne porte que `milk`, le biscuit porte aussi le gluten
  # et l'œuf. L'entrée existe pour que la ligne résolve correctement ; la liste
  # `_NEVER_RELAXED` du parseur interdit en plus d'y arriver par règle.
  - name: Petit-beurre
    aliases: [petit beurre, petit beurre lu]
    allergens: [gluten, eggs, milk]
    categories: [cereal]
  - name: Crème pâtissière
    aliases: [creme patissiere]
    allergens: [milk, eggs, gluten]
    categories: [dairy]
  # `pâte` seul est trop ambigu pour porter un allergène : pâte à tarte, pâtes
  # alimentaires, pâte de fruits. Laissé sans allergène ET signalé — c'est
  # typiquement une entrée à trancher à la relecture.
  - name: Pâte (non qualifiée)
    aliases: [pate,
              pate filo]
    allergens: [gluten]
    categories: [cereal]

