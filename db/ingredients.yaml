  # ── Bouillons ─────────────────────────────────────────────────────────────
  # Les bouillons cubes du commerce contiennent presque toujours du céleri, et
  # souvent du gluten. C'est l'exemple canonique d'un allergène invisible dans
  # le nom (I2).
  - name: Bouillon de légumes
    aliases: [bouillon de legume, bouillon,
              bouillon vegetal]
    allergens: [celery, gluten]
    categories: [broth]
  - name: Bouillon de volaille
    aliases: [bouillon de volaille, bouillon de poulet, fond de volaille]
    allergens: [celery, gluten]
    categories: [broth]
  - name: Fond de veau
    aliases: [fond de veau, fond brun]
    allergens: [celery, gluten]
    categories: [broth]
  # Le fumet porte en plus le poisson dont il est fait — l'omettre serait
  # exactement la règle 2 enfreinte : un composé qui masque un allergène.
  - name: Fumet de poisson
    aliases: [fumet de poisson, fond de poisson, bouillon de poisson]
    allergens: [celery, gluten, fish]
    categories: [broth]
  - name: Bouillon de bœuf
    aliases: [bouillon de boeuf]
    allergens: [celery, gluten]
    categories: [broth]

