  - { code: other, label: Autres }

ingredients:
  # ── Base : sel, poivre, eau ───────────────────────────────────────────────
  # Les lignes composées `sel et poivre` rejoignent `sel` : ni l'un ni l'autre
  # ne porte d'allergène, donc le raccourci ne peut rien masquer (règle 2).
  # Les sels d'origine rejoignent `sel` ; les sels AROMATISÉS non — `sel de
  # céleri` porte `celery`, `sel d'ail` et `sel aux herbes` ne sont pas du sel.
  # C'est la même raison qui interdit de dépouiller un complément en `de X`.
  - name: Sel
    aliases: [sel, sel fin, gros sel, sel marin, fleur de sel, sel et poivre, sel poivre,
              sel et poivre du moulin, sel et poivre au moulin, rase de sel,
              bonne pincee de sel, grosse pincee de sel,
              sel et poivre noir, sel poivre noir, sel et poivre noir au moulin,
              sel et poivre blanc au moulin, sel poivre blanc moulu, sel poivre du moulin,
              sel fin et poivre au moulin, sel fin poivre, sel et du poivre, sel et de poivre,
              sel de mer, sel de mer non raffine, sel non raffine, sel de guerande,
              sel de camargue, sel casher, sel gemme, sel fin marin, sel d'himalaya]
    allergens: []
    categories: [condiment]
  - name: Poivre
    aliases: [poivre, poivre noir, poivre blanc, poivre du moulin, poivre au moulin,
              poivre en grain, grain de poivre, grain de poivre noir, poivre noir moulu,
              poivre noir au moulin, quelque grain de poivre, poivre de cayenne,
              poivre baie]
    allergens: []
    categories: [herb_spice]
  - name: Eau
    aliases: [eau, eau froide, eau tiede, eau chaude, eau bouillante, glacon,
              eau gazeuse, glace pilee]
    allergens: []
    categories: [other]

