  - { code: white_meat, label: Viande blanche }
  - { code: charcuterie, label: Charcuterie }
  - { code: fish, label: Poisson }
  - { code: seafood, label: Fruits de mer }
  - { code: egg, label: Œufs }
  - { code: dairy, label: Produits laitiers }
  - { code: cheese, label: Fromages }
  - { code: nuts_seeds, label: Fruits à coque et graines }
  - { code: fat_oil, label: Matières grasses }
  - { code: sweetener, label: Sucres }
  - { code: herb_spice, label: Herbes et épices }
