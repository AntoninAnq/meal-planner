# Référentiel d'ingrédients — la donnée dont dépend le filtre allergène.
#
# ⚠️  CE FICHIER EST UNE PROPOSITION, PAS UNE VÉRITÉ.
#
# Il a été rédigé par un modèle, sur la distribution réelle des 28 802 lignes
# d'ingrédient du catalogue. I1 l'autorise à proposer et lui interdit de
# décider ; I2 et I3 font reposer le filtre allergène sur ces lignes.
#
# Le chargeur les insère donc avec `confirmed_at = NULL`, et la passe de
# résolution **ne compte que les ingrédients confirmés** pour dériver
# `allergens_verified`. Tant que tu n'as pas relu une entrée, les recettes qui
# en dépendent restent invisibles aux foyers à allergie sévère. La relecture
# n'est pas une politesse : c'est ce qui rend le catalogue utilisable.
#
#     docker compose run --rm catalog review
#
# ── Conventions ────────────────────────────────────────────────────────────
#
# `name`       nom canonique, affiché.
# `aliases`    les écritures rencontrées dans le catalogue. Le chargeur les
#              normalise (minuscules, sans accents, singulier), donc on peut
#              les écrire naturellement.
# `allergens`  parmi les 14 codes INCO. **Ce champ est le seul qui puisse
#              blesser quelqu'un.**
# `categories` sert au signal de rotation du §6.2, jamais à un filtre dur.
#
# ── Deux règles suivies en écrivant ────────────────────────────────────────
#
# 1. **Le doute penche vers l'allergène.** Une recette écartée à tort produit
#    un menu terne ; une recette gardée à tort produit une urgence. `sauce
#    soja` porte gluten ET soja parce que la version sans blé est l'exception.
#
# 2. **Une ligne composée n'est jamais aliasée vers un ingrédient qui masque
#    un allergène.** `sel et poivre` peut rejoindre `sel` — aucun des deux ne
#    porte d'allergène. `pâte feuilletée` ne rejoint pas `farine` : elle porte
#    aussi du lait.

